<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="chessGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Chess King Crown -->
  <path d="M50 15 L45 25 L40 20 L35 30 L30 25 L25 35 L75 35 L70 25 L65 30 L60 20 L55 25 L50 15 Z" 
        fill="url(#chessGradient)" stroke="#00ff41" stroke-width="2"/>
  
  <!-- King Body -->
  <rect x="35" y="35" width="30" height="40" fill="url(#chessGradient)" stroke="#00ff41" stroke-width="2" rx="5"/>
  
  <!-- Base -->
  <ellipse cx="50" cy="80" rx="25" ry="8" fill="url(#chessGradient)" stroke="#00ff41" stroke-width="2"/>
  
  <!-- Cross on Crown -->
  <line x1="50" y1="10" x2="50" y2="20" stroke="#00ff41" stroke-width="3"/>
  <line x1="45" y1="15" x2="55" y2="15" stroke="#00ff41" stroke-width="3"/>
  
  <!-- Tactical Grid Overlay -->
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1a4d3a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#grid)"/>
</svg>